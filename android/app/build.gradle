plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}



def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
   def keystorePropertiesFile = rootProject.file('key.properties')
   if (keystorePropertiesFile.exists()) {
       keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// 16 KB sayfa boyutunu desteklemeyen ML Kit modüllerini tamamen hariç tut
configurations.all {
    exclude group: "com.google.mlkit", module: "digital-ink-recognition"
    exclude group: "com.google.mlkit", module: "entity-extraction"
}

android {
    namespace 'com.volkan.wallet_app'
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId "com.volkan.wallet_app"
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode.toInteger()
        versionName = flutter.versionName
    }

    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }
   
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    packagingOptions {
        jniLibs {
            excludes += ["**/libdigitalink.so", "**/libtextclassifier3_jni_tclib.so"]
            // Legacy packaging: .so files are stored compressed and extracted
            // at install time, so APK zip alignment does not matter. 16 KB
            // page-size devices still need 16 KB-aligned ELF LOAD segments;
            // verified 2026-10-21 with `llvm-objdump -p`: barhopper_v3,
            // mlkit_google_ocr_pipeline, image_processing_util_jni,
            // surface_util_jni, datastore_shared_counter = 2**14, flutter/app = 2**16.
            useLegacyPackaging true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.google.android.gms:play-services-pay:16.5.0'
    // ZXing core for barcode bitmap generation inside the loyalty widget.
    // We only use the core library — the Android extras pull in camera /
    // scanning code we don't need (Flutter side already handles capture).
    implementation 'com.google.zxing:core:3.5.3'
}
